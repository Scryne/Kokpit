name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    # Hedef platform Windows: node-pty ConPTY uzerinden calisir, PTY testi burada anlamli.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: PTY server end-to-end
        run: npm run test:pty
