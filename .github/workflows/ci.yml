name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    # Hedef platform Windows: node-pty ConPTY uzerinden calisir, PTY testi burada anlamli.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: PTY server end-to-end
        run: npm run test:pty

      - name: Hook bridge (kanca)
        run: npm run test:kanca

      # Ada'nin saf kararlari (tam ekran/sinema, yer, ust katman), oturumsuz limit (sahte uc), dis
      # oturumlar ve gorevin gercek pwsh'ta tek arguman gecisi. Gercek ~/.claude'a dokunmaz.
      - name: Ada (limit, dis oturumlar, gorev, tam ekran)
        run: npm run test:ada
